name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' && format('go-trader-ci-pr-{0}', github.ref) || format('go-trader-ci-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == '1' }}

jobs:
  changes:
    runs-on: ubuntu-26.04
    timeout-minutes: 7
    outputs:
      code: ${{ steps.diff.outputs.code }}
      quote: ${{ steps.diff.outputs.quote }}
      egress_docker: ${{ steps.diff.outputs.egress_docker }}
      merge_paper: ${{ steps.diff.outputs.merge_paper }}
      update: ${{ steps.diff.outputs.update }}
      migrate: ${{ steps.diff.outputs.migrate }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check the change detector and its wiring
        run: bash scripts/check_ci_code_changed.sh

      - name: Decide whether the change touches anything a test reads
        id: diff
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: bash scripts/ci_code_changed.sh

  go:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 7
    steps:
      - name: Record the job start
        run: date +%s >"$RUNNER_TEMP/ci-job-started"

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: scheduler/go.sum

      - name: Copy the checkout before any Python setup
        run: cp -a "$GITHUB_WORKSPACE" "$RUNNER_TEMP/go-only"

      - name: Start the remaining Go tests
        run: bash scripts/ci_lane.sh start --ram-tmp go -- go -C "$RUNNER_TEMP/go-only/scheduler" test -skip '^TestFeedWeight' ./...

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: uv sync --compile-bytecode

      - name: Build the Python-backed Go tests once for every lane
        run: go -C scheduler test -tags pyintegration -run '^$' ./...

      - name: Build the Python-backed binary once for every lane
        run: go -C scheduler build -tags pyintegration -o /dev/null .

      - name: Start the feed and quote tests
        run: bash scripts/ci_lane.sh start --ram-tmp --no-skips feed-quotes -- go -C scheduler test -v -timeout 30m -tags pyintegration -run '^(TestFeedWeightSharedProcesses|TestDashboardCandleIsolation[A-Za-z]*|TestCheckQuotePrecision[A-Za-z]*|TestRobinhoodOptionMarks[A-Za-z]*|TestIBKROptionMarks[A-Za-z]*)$' ./...

      - name: Start the Robinhood order tests
        run: bash scripts/ci_lane.sh start --ram-tmp --no-skips robinhood-orders -- go -C scheduler test -v -timeout 30m -tags pyintegration -run '^TestRobinhoodLiveOrder[A-Za-z]*$' ./...

      - name: Start the regime and update helper tests
        run: bash scripts/ci_lane.sh start --ram-tmp --no-skips regime-gates -- go -C scheduler test -v -timeout 30m -tags pyintegration -run '^(TestRegimeReadinessContractIntegration|TestRegimeSide[A-Za-z]*|TestUpdateHelpersEnvfileParsing790|TestZeroTrailingStopPctReloadKeepsTheTrailingATRStop)$' ./...

      - name: Format check (every tracked Go file)
        run: |
          set -o pipefail
          unformatted=$(git ls-files -z '*.go' | xargs -0 -r gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::error::Go files need gofmt -w:"
            echo "$unformatted"
            exit 1
          fi

      - name: Wait for every lane
        if: ${{ !cancelled() }}
        run: bash scripts/ci_lane.sh join

  go-race:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 7
    steps:
      - name: Record the job start
        run: date +%s >"$RUNNER_TEMP/ci-job-started"

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: scheduler/go.sum

      - name: Build the race tests once for every lane
        run: go -C scheduler test -race -run '^$' .

      - name: Start the feed weight ledger race check
        run: bash scripts/ci_lane.sh start --ram-tmp feed-weight -- go -C scheduler test -race -count=1 -timeout 15m -run '^TestFeedWeight' .

      - name: Start the quote coordinator race check
        if: ${{ needs.changes.outputs.quote == 'true' }}
        run: bash scripts/ci_lane.sh start --ram-tmp quote -- go -C scheduler test -race -count=1 -timeout 30m -run '^TestQuote' -skip '^(TestQuoteReplayRunsThePolicyThroughTheRealCoordinator|TestQuoteReplayResumeMatchesAnUninterruptedRun|TestQuoteReplayFaultsRecoverWithTheirStatedClass|TestQuoteReplayRefusesUnsafeStateAndInputs|TestQuoteReplayLaterReceiptsLeaveEarlierDecisionsUnchanged|TestQuoteReplayCoverageAndTimingRefusals|TestQuotePolicyBoundaryCasesThroughTheRealCoordinator)$' .

      - name: Wait for every lane
        if: ${{ !cancelled() }}
        run: bash scripts/ci_lane.sh join

  go-python-integration:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 7
    steps:
      - name: Record the job start
        run: date +%s >"$RUNNER_TEMP/ci-job-started"

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: scheduler/go.sum

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: uv sync --compile-bytecode

      - name: Build the Python-backed Go tests once for every lane
        run: go -C scheduler test -tags pyintegration -run '^$' ./...

      - name: Build the Python-backed binary once for every lane
        run: go -C scheduler build -tags pyintegration -o /dev/null .

      - name: Start the remaining Python-backed Go tests
        run: bash scripts/ci_lane.sh start --ram-tmp --no-skips main -- go -C scheduler test -v -timeout 30m -tags pyintegration -run '^(TestHLBankruptcyBoundPreflight[A-Za-z]*|TestFeedWeightSharedProcesses|TestFeedFundingProofRealCheckScript|TestMergePaperInstance|TestOrphanOptionPositionsCLIAndStartupIntegration|TestUpdateCanonicalDBPathMatchesScheduler|TestUpdateHelpersEnvfileParsing790|TestUpdateShell[A-Za-z0-9]*|TestApplyUpgrade[A-Za-z0-9]*|TestHLPaperLotParityWithLiveGateAndBacktester|TestHLPaperFundingParityWithBacktester|TestClosedBarEntryAllowanceMatchesBacktesterWithRealCheckScript|TestTrueStrengthIndexAddedPaperEntryRunsThroughTheRealCheckScript|TestBitcoinLeadLagGoPayload[A-Za-z]*|TestRobinhoodScriptStdout[A-Za-z]*|TestRobinhoodLiveOrder[A-Za-z]*|TestRobinhoodAccountBinding[A-Za-z]*|TestRobinhoodTimeframe[A-Za-z]*|TestRobinhoodSpotCoinAdmission[A-Za-z]*|TestRobinhoodRegimeClasses[A-Za-z]*|TestRobinhoodOptionMarks[A-Za-z]*|TestIBKROptionMarks[A-Za-z]*|TestOptionsLiveModeRealCheckScript[A-Za-z]*|TestCheckQuotePrecision[A-Za-z]*|TestElderForcePullbackAddedPaperEntryRunsThroughTheRealCheckScript|TestEntryRecoveryRealHLOrderLookupFailureOnlyBlocksTheRelease|TestEntryAccountKeysMatchTheRecoveryScripts|TestMassIndexReversalAddedPaperEntryRunsThroughTheRealCheckScript|TestRegimeCompareResolversMatchLive|TestRegimeReadinessContract[A-Za-z]*|TestRestingTPRuleGoAndCheckScanAcrossChecks|TestTunerPreviewStopPayloadContract|TestTunerPreviewHandlerRegimeTimeframeRefusesPerArm|TestTunerPreviewHandlerAppliesCertifiedDirectionalPolicy|TestTunerPreviewHandlerOpenStrategyOverrides|TestEgressPython[A-Za-z]*|TestHTFFilterIntegration[A-Za-z]*|TestChartPatternHTFGate[A-Za-z]*|TestRegimeSide[A-Za-z]*|TestQuoteVenuePython[A-Za-z]*|TestQuoteReplayPython[A-Za-z]*|TestPaperResearchScheduler[A-Za-z]*|TestHLAgent[A-Za-z]*|TestPaperChildPriority[A-Za-z]*|TestPaperOnlyConfig[A-Za-z]*|TestPaperManualVenueGuard[A-Za-z]*|TestSlashCommandDaemon[A-Za-z]*|TestTradeReviewRealCandleScript[A-Za-z]*|TestTradeFeedbackAnalysisReal[A-Za-z]*|TestCandleArchivePublisherGoldenParity|TestDashboardCandleIsolation[A-Za-z]*|TestZeroTrailingStopPctReloadKeepsTheTrailingATRStop)$' -skip '^(TestPaperManualVenueGuard[A-Za-z]*|TestRegimeReadinessContractIntegration|TestRegimeSide[A-Za-z]*|TestMergePaperInstance|TestFeedWeightSharedProcesses|TestDashboardCandleIsolation[A-Za-z]*|TestCheckQuotePrecision[A-Za-z]*|TestRegimeReadinessContractProcesses|TestChartPatternHTFGateRefusedReloadKeepsThePreviousConfig|TestZeroTrailingStopPctReloadKeepsTheTrailingATRStop|TestUpdateHelpersEnvfileParsing790|TestRobinhoodLiveOrder[A-Za-z]*|TestRobinhoodAccountBinding[A-Za-z]*|TestRobinhoodScriptStdout[A-Za-z]*|TestRobinhoodTimeframe[A-Za-z]*|TestRobinhoodSpotCoinAdmission[A-Za-z]*|TestRobinhoodRegimeClasses[A-Za-z]*|TestRobinhoodOptionMarks[A-Za-z]*|TestIBKROptionMarks[A-Za-z]*)$' ./...

      - name: Start the Robinhood tests
        run: bash scripts/ci_lane.sh start --ram-tmp --no-skips robinhood -- go -C scheduler test -v -timeout 30m -tags pyintegration -run '^(TestRobinhoodAccountBinding[A-Za-z]*|TestRobinhoodScriptStdout[A-Za-z]*|TestRobinhoodTimeframe[A-Za-z]*|TestRobinhoodSpotCoinAdmission[A-Za-z]*|TestRobinhoodRegimeClasses[A-Za-z]*)$' ./...

      - name: Start the paper merge suite
        if: ${{ needs.changes.outputs.merge_paper == 'true' }}
        run: bash scripts/ci_lane.sh start --no-skips merge-paper-instance -- go -C scheduler test -v -timeout 30m -tags pyintegration -run '^TestMergePaperInstance$' ./...

      - name: Wait for every lane
        if: ${{ !cancelled() }}
        run: bash scripts/ci_lane.sh join

  go-python-integration-process-cycles:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 7
    steps:
      - name: Record the job start
        run: date +%s >"$RUNNER_TEMP/ci-job-started"

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: scheduler/go.sum

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: uv sync --compile-bytecode

      - name: Start the process cycle tests
        run: bash scripts/ci_lane.sh start --ram-tmp --no-skips process-cycles -- go -C scheduler test -v -timeout 30m -tags pyintegration -run '^(TestRegimeReadinessContractProcesses|TestChartPatternHTFGateRefusedReloadKeepsThePreviousConfig)$' ./...

      - name: Wait for every lane
        if: ${{ !cancelled() }}
        run: bash scripts/ci_lane.sh join

  go-python-integration-paper-manual:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 7
    steps:
      - name: Record the job start
        run: date +%s >"$RUNNER_TEMP/ci-job-started"

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: scheduler/go.sum

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: uv sync --compile-bytecode

      - name: Start the paper manual tests
        run: bash scripts/ci_lane.sh start --ram-tmp --no-skips paper-manual -- go -C scheduler test -v -timeout 30m -tags pyintegration -run '^TestPaperManualVenueGuard[A-Za-z]*$' ./...

      - name: Wait for every lane
        if: ${{ !cancelled() }}
        run: bash scripts/ci_lane.sh join

  shell-suites:
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: scheduler/go.sum

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: |
          uv sync
          sudo apt-get update
          sudo apt-get install -y strace nftables iproute2
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0755 /opt/egress
          UV_PYTHON_INSTALL_DIR=/opt/egress/python UV_PROJECT_ENVIRONMENT=/opt/egress/venv uv sync --no-dev --compile-bytecode
          chmod -R a+rX /opt/egress

      - name: Build
        run: |
          go -C scheduler build -o "$RUNNER_TEMP/go-trader" .
          go -C scheduler build -o "$RUNNER_TEMP/go-trader-egress-controller" ./cmd/egress-controller
          go -C scheduler build -o "$RUNNER_TEMP/egress-fixture" ./cmd/egress-fixture

      - name: Observation replay suite
        run: |
          bash scripts/run_ci_shell_suite.sh \
            --marker 'PASS: observation replay harness (sealed payload decisions match recording replay; tampered and truncated recordings refused)' \
            -- bash scripts/test_observation_replay.sh

      - name: Trade-flow replay suite
        run: |
          bash scripts/run_ci_shell_suite.sh \
            --marker 'PASS: trade-flow replay harness (sealed trade-flow payloads and decisions match the independent recording replay; tampered, truncated and contradicted recordings refused)' \
            -- bash scripts/test_trade_flow_replay.sh

      - name: Macro-event replay suite
        run: |
          bash scripts/run_ci_shell_suite.sh \
            --marker 'PASS: macro-event replay harness (Python-imported artifacts sealed by the Go owner give equal websocket, shared and offline decisions; altered artifact bytes refused)' \
            -- bash scripts/test_macro_event_replay.sh

      - name: Volume-profile replay suite
        run: |
          bash scripts/run_ci_shell_suite.sh \
            --marker 'PASS: volume-profile replay harness (sealed profile sessions, hand-calculated value areas and decisions match the independent recording replay; tampered, truncated, contradicted and unclosed recordings refused)' \
            -- bash scripts/test_volume_profile_replay.sh

      - name: Order-book replay suite
        run: |
          bash scripts/run_ci_shell_suite.sh \
            --marker 'PASS: l2_book replay harness (sealed book payloads match the independent recording replay; mixed v3 runs keep every importer; tampered, truncated, unclosed, dropped, mislabeled and contradicted recordings refused)' \
            -- bash scripts/test_book_replay.sh

      - name: Premium replay suite
        run: |
          bash scripts/run_ci_shell_suite.sh \
            --marker 'PASS: premium replay harness (sealed quote/oracle payloads and decisions match the independent recording replay; premium-only, book-only and mixed v3 runs import by their typed contracts and kind/contract mismatches are refused; tampered, truncated and contradicted recordings refused)' \
            -- bash scripts/test_premium_replay.sh

      - name: Quote replay suite
        run: |
          bash scripts/run_ci_shell_suite.sh \
            --marker 'PASS: quote replay harness (recorder output replays through the real quote coordinator with an equal independent ledger; resume reproduces records; the frozen study scores every split; depth-only, raw-trade-gap, tampered, altered, credentialed and archive-cache inputs refused or unscored; ordinary discovery unchanged)' \
            -- bash scripts/test_quote_replay.sh

      - name: Feed parity audit suite
        run: |
          bash scripts/run_ci_shell_suite.sh \
            --marker 'PASS: feed-parity audit (per-key backup fills from one backup seal pass; wrong or unlogged backup seals, same-seal fill contradictions and every earlier failure rule fail)' \
            -- bash scripts/test_feed_parity.sh

      - name: Shared feed conversion budget suite
        run: |
          bash scripts/run_ci_shell_suite.sh \
            --marker 'PASS: shared-feed-convert budget (a new backup needs the full weight policy; an unsafe candidate fails the real probe with the config bytes unchanged and no SIGHUP; a calibration failure restores a byte-identical config; calibrate refuses a backup that is not steady, keeps room for the largest single read and refuses non-numeric /health values; a tree owned by another user is probed only as its owner; no root write follows a planted symlink or a symlinked parent; a consumer config symlink resolves only to the own config of that unit, or into its own go-trader StateDirectory, and a config another unit also uses is refused; switch and rollback refuse a config path that changed after it was recorded; the inventory reports a refused unit that is not selected and continues; a config path with a control character, a symlinked state folder or a shared state folder is refused; switch, its failure restore and rollback succeed on the migrated layout and a legacy tree, also through a root-owned folder symlink)' \
            -- env GO_TRADER_BIN="$RUNNER_TEMP/go-trader" bash scripts/test_shared_feed_convert_budget.sh

      - name: Allow unprivileged user namespaces for the ledger capture worker
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Ledger capture and export suite
        run: |
          bash scripts/run_ci_shell_suite.sh \
            --marker 'PASS: ledger capture and export (active-WAL capture without source effects, version 2 export contract, every refusal leaves inputs unchanged)' \
            --forbid 'NOTE: strace is not installed; the syscall audit of capture is skipped' \
            --forbid 'NOTE: unshare --user is unavailable here; the shared-mount-namespace worker refusal in a new user namespace is not checked' \
            --forbid 'NOTE: running as root; the permission-denied refusal is not exercised' \
            -- env GO_TRADER_BIN="$RUNNER_TEMP/go-trader" LEDGER_EXPORT_REQUIRE_CAPTURE=1 LEDGER_EXPORT_REQUIRE_STRACE=1 bash scripts/test_ledger_export.sh

      - name: Restore the user namespace restriction
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1

      - name: Paper merge service fixture (root, systemd)
        run: |
          bash scripts/run_ci_shell_suite.sh \
            --marker 'OK: merge-paper service fixture passed (exit 79 for the second start)' \
            -- sudo env GO_TRADER_BIN="$RUNNER_TEMP/go-trader" MERGE_PAPER_SERVICE_FIXTURE_REQUIRE_RUN=1 bash scripts/test_merge_paper_service_fixture.sh

      - name: Robinhood session service fixture (root, systemd)
        run: |
          bash scripts/run_ci_shell_suite.sh \
            --marker 'OK: robinhood session service fixture passed (state-directory session, owner-only modes, no home writes, reuse on second start)' \
            -- sudo env GO_TRADER_BIN="$RUNNER_TEMP/go-trader" FIXTURE_UV="$(command -v uv)" ROBINHOOD_SESSION_SERVICE_FIXTURE_REQUIRE_RUN=1 bash scripts/test_robinhood_session_service_fixture.sh

      - name: Egress enforcement suite (root, systemd)
        run: |
          bash scripts/run_ci_shell_suite.sh \
            --marker 'PASS: egress enforcement (namespace rules, attestation, relay-only egress, controller loss, address refresh, refusal paths)' \
            --forbid 'NOTE: systemd is not running; the unit sandbox and the launcher are not checked' \
            -- sudo env GO_TRADER_BIN="$RUNNER_TEMP/go-trader" EGRESS_CONTROLLER_BIN="$RUNNER_TEMP/go-trader-egress-controller" EGRESS_FIXTURE_BIN="$RUNNER_TEMP/egress-fixture" EGRESS_VENV_PYTHON=/opt/egress/venv/bin/python3 EGRESS_FIXTURE_REQUIRE_RUN=1 EGRESS_REQUIRE_SYSTEMD=1 bash scripts/test_egress_enforcement.sh

  shell-suites-migrate-1:
    needs: changes
    if: ${{ needs.changes.outputs.update == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: scheduler/go.sum

      - name: Build
        run: go -C scheduler build -o "$RUNNER_TEMP/go-trader" .

      - name: Service layout migration fixture (root, systemd)
        run: |
          bash scripts/run_ci_shell_suite.sh \
            --marker 'OK: migrate-service-layout fixture passed (update)' \
            --forbid 'note: this host has a system uv; the root-private uv refusals are skipped' \
            -- sudo env GO_TRADER_BIN="$RUNNER_TEMP/go-trader" FIXTURE_GO="$(command -v go)" FIXTURE_SCENARIOS='update' MIGRATE_SERVICE_LAYOUT_FIXTURE_REQUIRE_RUN=1 bash scripts/test_migrate_service_layout_fixture.sh

  shell-suites-migrate-2:
    needs: changes
    if: ${{ needs.changes.outputs.migrate == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: scheduler/go.sum

      - name: Build
        run: go -C scheduler build -o "$RUNNER_TEMP/go-trader" .

      - name: Service layout migration fixture (root, systemd)
        run: |
          bash scripts/run_ci_shell_suite.sh \
            --marker 'OK: migrate-service-layout fixture passed (stages kill refuse plan)' \
            --forbid 'note: this host has a system uv; the root-private uv refusals are skipped' \
            -- sudo env GO_TRADER_BIN="$RUNNER_TEMP/go-trader" FIXTURE_GO="$(command -v go)" FIXTURE_SCENARIOS='stages kill refuse plan' MIGRATE_SERVICE_LAYOUT_FIXTURE_REQUIRE_RUN=1 bash scripts/test_migrate_service_layout_fixture.sh

  shell-suites-migrate-6:
    needs: changes
    if: ${{ needs.changes.outputs.migrate == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: scheduler/go.sum

      - name: Build
        run: go -C scheduler build -o "$RUNNER_TEMP/go-trader" .

      - name: Service layout migration fixture (root, systemd)
        run: |
          bash scripts/run_ci_shell_suite.sh \
            --marker 'OK: migrate-service-layout fixture passed (confirm apply latch conflict resume signal fold newtarget)' \
            --forbid 'note: this host has a system uv; the root-private uv refusals are skipped' \
            -- sudo env GO_TRADER_BIN="$RUNNER_TEMP/go-trader" FIXTURE_GO="$(command -v go)" FIXTURE_SCENARIOS='confirm apply latch conflict resume signal fold newtarget' MIGRATE_SERVICE_LAYOUT_FIXTURE_REQUIRE_RUN=1 bash scripts/test_migrate_service_layout_fixture.sh

  shell-suites-migrate-3:
    needs: changes
    if: ${{ needs.changes.outputs.update == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: scheduler/go.sum

      - name: Build
        run: go -C scheduler build -o "$RUNNER_TEMP/go-trader" .

      - name: Service layout migration fixture (root, systemd)
        run: |
          bash scripts/run_ci_shell_suite.sh \
            --marker 'OK: migrate-service-layout fixture passed (update_recovery)' \
            --forbid 'note: this host has a system uv; the root-private uv refusals are skipped' \
            -- sudo env GO_TRADER_BIN="$RUNNER_TEMP/go-trader" FIXTURE_GO="$(command -v go)" FIXTURE_SCENARIOS='update_recovery' MIGRATE_SERVICE_LAYOUT_FIXTURE_REQUIRE_RUN=1 bash scripts/test_migrate_service_layout_fixture.sh

  shell-suites-migrate-4:
    needs: changes
    if: ${{ needs.changes.outputs.update == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: scheduler/go.sum

      - name: Build
        run: go -C scheduler build -o "$RUNNER_TEMP/go-trader" .

      - name: Service layout migration fixture (root, systemd)
        run: |
          bash scripts/run_ci_shell_suite.sh \
            --marker 'OK: migrate-service-layout fixture passed (update_recovery_restart)' \
            --forbid 'note: this host has a system uv; the root-private uv refusals are skipped' \
            -- sudo env GO_TRADER_BIN="$RUNNER_TEMP/go-trader" FIXTURE_GO="$(command -v go)" FIXTURE_SCENARIOS='update_recovery_restart' MIGRATE_SERVICE_LAYOUT_FIXTURE_REQUIRE_RUN=1 bash scripts/test_migrate_service_layout_fixture.sh

  checks:
    needs: changes
    runs-on: ubuntu-26.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: uv sync

      - name: Every pre-PR check
        run: bash scripts/check_pre_pr.sh

      - name: Check the lane runner
        run: bash scripts/check_ci_lane.sh

      - uses: actions/setup-go@v7
        if: ${{ needs.changes.outputs.egress_docker == 'true' }}
        with:
          go-version: '1.26'
          cache-dependency-path: scheduler/go.sum

      - name: Install the egress suite tools
        if: ${{ needs.changes.outputs.egress_docker == 'true' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2

      - name: Build the egress suite binaries
        if: ${{ needs.changes.outputs.egress_docker == 'true' }}
        run: |
          go -C scheduler build -o "$RUNNER_TEMP/go-trader-egress-controller" ./cmd/egress-controller
          go -C scheduler build -o "$RUNNER_TEMP/egress-fixture" ./cmd/egress-fixture

      - name: Build the image for the egress docker suite
        if: ${{ needs.changes.outputs.egress_docker == 'true' }}
        run: docker build -t ghcr.io/richkuo/go-trader:egress-ci .

      - name: Egress docker suite (root, rootful Docker)
        if: ${{ needs.changes.outputs.egress_docker == 'true' }}
        run: |
          bash scripts/run_ci_shell_suite.sh \
            --marker 'PASS: egress docker deployment (anchor enforcement, application attestation, relay-only egress, status relay, one-shot commands, anchor restart)' \
            -- sudo env EGRESS_CONTROLLER_BIN="$RUNNER_TEMP/go-trader-egress-controller" EGRESS_FIXTURE_BIN="$RUNNER_TEMP/egress-fixture" EGRESS_TEST_IMAGE=ghcr.io/richkuo/go-trader:egress-ci EGRESS_DOCKER_FIXTURE_REQUIRE_RUN=1 bash scripts/test_egress_docker.sh

  python-shard:
    name: python-shard (${{ matrix.suite }} ${{ matrix.group }}/${{ matrix.splits }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 7
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: default, group: 1, splits: 1, paths: ''}
          - {suite: shared_scripts, group: 1, splits: 1, paths: shared_scripts/}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.3

      - name: Install dependencies
        run: uv sync

      - name: Collect every test of the suite
        env:
          SUITE: ${{ matrix.suite }}
          PATHS: ${{ matrix.paths }}
        run: uv run python3 scripts/check_pytest_shards.py collect "$SUITE" --out "$RUNNER_TEMP/pytest-collect/$SUITE.json" ${PATHS:+-- "$PATHS"}

      - name: Run tests
        env:
          SUITE: ${{ matrix.suite }}
          GROUP: ${{ matrix.group }}
          SPLITS: ${{ matrix.splits }}
          PATHS: ${{ matrix.paths }}
        run: |
          uv run pytest ${PATHS:+"$PATHS"} -n auto --dist=worksteal --durations=25 \
            --splits="$SPLITS" --group="$GROUP" --splitting-algorithm=least_duration \
            --durations-path="scripts/pytest_durations/$SUITE.json" \
            --report-log="$RUNNER_TEMP/pytest-shards/$SUITE-$GROUP-of-$SPLITS.jsonl"

      - name: Every collected test ran exactly once and passed
        if: ${{ !cancelled() }}
        env:
          SUITE: ${{ matrix.suite }}
        run: |
          uv run --no-project python3 scripts/check_pytest_shards.py verify "$SUITE" \
            --collected "$RUNNER_TEMP/pytest-collect/$SUITE.json" --logs "$RUNNER_TEMP/pytest-shards" \
            --durations "scripts/pytest_durations/$SUITE.json" --durations-out "$RUNNER_TEMP/pytest-durations/$SUITE.json"

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: pytest-shard-${{ matrix.suite }}-${{ matrix.group }}-of-${{ matrix.splits }}
          path: ${{ runner.temp }}/pytest-shards/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: pytest-durations-${{ matrix.suite }}
          path: ${{ runner.temp }}/pytest-durations/
          if-no-files-found: warn
          retention-days: 90
