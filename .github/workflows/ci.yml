name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Agent instructions size and layout
        run: |
          fail=0
          if [ -L CLAUDE.md ] || [ ! -f CLAUDE.md ]; then
            echo "::error::CLAUDE.md must be a regular file at the repository root."
            fail=1
          fi
          if [ ! -L AGENTS.md ] || [ "$(readlink AGENTS.md)" != "CLAUDE.md" ]; then
            echo "::error::AGENTS.md must be a symlink to CLAUDE.md."
            fail=1
          fi
          extra=$(git ls-files | grep -E '(^|/)(CLAUDE(\.local)?\.md|AGENTS\.md)$' | grep -vx -e 'CLAUDE.md' -e 'AGENTS.md' || true)
          if [ -n "$extra" ]; then
            echo "::error::Agent instructions stay in one root CLAUDE.md. Remove these files:"
            echo "$extra"
            fail=1
          fi
          if [ -f CLAUDE.md ] && [ ! -L CLAUDE.md ]; then
            bytes=$(wc -c < CLAUDE.md | tr -d ' ')
            echo "CLAUDE.md: $bytes bytes (ceiling 17000, target 16500)"
            if [ "$bytes" -ge 17000 ]; then
              echo "::error::CLAUDE.md is $bytes bytes, at or above the 17000-byte ceiling. Move mechanism to SKILL.md, shorten wording, drop no guardrail."
              echo "Bytes per section:"
              LC_ALL=C awk 'BEGIN{h="(header)"} /^## /{printf "%6d  %s\n",n,h; h=$0; n=0} {n+=length($0)+1} END{printf "%6d  %s\n",n,h}' CLAUDE.md
              fail=1
            elif [ "$bytes" -gt 16500 ]; then
              echo "::warning::CLAUDE.md is $bytes bytes, above the 16500-byte target. The CI check fails at 17000."
            fi
          fi
          exit $fail

      - name: SKILL.md and POST_UPDATE_HISTORY.md line length
        run: |
          limit=1000
          LC_ALL=C awk -v limit="$limit" '
            FNR == 1 { fence = 0 }
            match($0, /^ *```/) && RLENGTH <= 6 { fence = !fence; next }
            fence { next }
            $0 ~ /^[ \t]*\|/ { next }
            length($0) > limit {
              printf "::error file=%s,line=%d::line is %d bytes, above the %d-byte limit. Put one sentence per line.\n", FILENAME, FNR, length($0), limit
              bad = 1
            }
            END { exit bad }
          ' SKILL.md docs/POST_UPDATE_HISTORY.md

      - name: .github/scripts holds only test_workflow_logic.py
        run: |
          files=$(git ls-files .github/scripts)
          if [ "$files" != ".github/scripts/test_workflow_logic.py" ]; then
            echo "::error::.github/scripts must hold exactly test_workflow_logic.py. Put other scripts under scripts/. Tracked files:"
            echo "$files"
            exit 1
          fi

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: scheduler/go.sum

      - name: Build
        run: cd scheduler && go build -ldflags "-X main.Version=$(git describe --tags --always --dirty=-mod)" .

      - name: Remaining Go tests
        run: cd scheduler && go test ./...

      - name: Basket coordinator race check
        run: cd scheduler && go test -race -count=1 -run '^TestBasket' .

      - name: Quote coordinator race check
        run: cd scheduler && go test -race -count=1 -run '^TestQuote' .

      - name: Format check (every tracked Go file)
        run: |
          set -o pipefail
          unformatted=$(git ls-files -z '*.go' | xargs -0 -r gofmt -l)
          if [ -n "$unformatted" ]; then
            echo "::error::Go files need gofmt -w:"
            echo "$unformatted"
            exit 1
          fi

  go-python-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: scheduler/go.sum

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Python-backed Go integration tests
        run: |
          set -o pipefail
          go -C scheduler test -v -timeout 30m -tags pyintegration -run '^(TestHLBankruptcyBoundPreflight[A-Za-z]*|TestMergePaperInstance|TestUpdateCanonicalDBPathMatchesScheduler|TestUpdateHelpersEnvfileParsing790|TestHLPaperLotParityWithLiveGateAndBacktester|TestHLPaperFundingParityWithBacktester|TestClosedBarEntryAllowanceMatchesBacktesterWithRealCheckScript|TestTrueStrengthIndexAddedPaperEntryRunsThroughTheRealCheckScript|TestBasketRealRanker[A-Za-z]*|TestBasketMemberRealCheckIsManagementOnly|TestBasketMemberBatched[A-Za-z]*|TestBasketReplay[A-Za-z]*|TestBitcoinLeadLagGoPayload[A-Za-z]*|TestRobinhoodScriptStdout[A-Za-z]*|TestRobinhoodLiveOrder[A-Za-z]*|TestRobinhoodTimeframe[A-Za-z]*|TestCheckQuotePrecision[A-Za-z]*|TestElderForcePullbackAddedPaperEntryRunsThroughTheRealCheckScript|TestEntryOperatorRealOKXQueryErrorRefusesTheRelease|TestEntryRecoveryRealHLOrderLookupFailureOnlyBlocksTheRelease|TestEntryAccountKeysMatchTheRecoveryScripts|TestMassIndexReversalAddedPaperEntryRunsThroughTheRealCheckScript|TestRegimeCompareResolversMatchLive|TestRestingTPRuleGoAndCheckScanAcrossChecks|TestTunerPreviewStopPayloadContract|TestTunerPreviewHandlerRegimeTimeframeRefusesPerArm|TestTunerPreviewHandlerAppliesCertifiedDirectionalPolicy|TestEgressPython[A-Za-z]*|TestHTFFilterIntegration[A-Za-z]*|TestQuoteVenuePython[A-Za-z]*)$' -skip '^(TestBasketReplay[A-Za-z]*|TestMergePaperInstance)$' ./... 2>&1 | tee "$RUNNER_TEMP/pyintegration.log"
          if grep -n -- '--- SKIP' "$RUNNER_TEMP/pyintegration.log"; then
            echo "::error::a Python-backed Go integration test reported SKIP, so it proved nothing"
            exit 1
          fi

  go-python-integration-merge-paper-instance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Python-backed Go integration tests
        run: |
          set -o pipefail
          go -C scheduler test -v -timeout 30m -tags pyintegration -run '^TestMergePaperInstance$' ./... 2>&1 | tee "$RUNNER_TEMP/pyintegration.log"
          if grep -n -- '--- SKIP' "$RUNNER_TEMP/pyintegration.log"; then
            echo "::error::a Python-backed Go integration test reported SKIP, so it proved nothing"
            exit 1
          fi

  go-python-integration-basket-replay-momentum-study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: scheduler/go.sum

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Python-backed Go integration tests
        run: |
          set -o pipefail
          go -C scheduler test -v -timeout 30m -tags pyintegration -run '^TestBasketReplayMomentumStudy[A-Za-z]*$' ./... 2>&1 | tee "$RUNNER_TEMP/pyintegration.log"
          if grep -n -- '--- SKIP' "$RUNNER_TEMP/pyintegration.log"; then
            echo "::error::a Python-backed Go integration test reported SKIP, so it proved nothing"
            exit 1
          fi

  go-python-integration-basket-replay-reversal-study:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: scheduler/go.sum

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Python-backed Go integration tests
        run: |
          set -o pipefail
          go -C scheduler test -v -timeout 30m -tags pyintegration -run '^TestBasketReplayReversalStudy[A-Za-z]*$' ./... 2>&1 | tee "$RUNNER_TEMP/pyintegration.log"
          if grep -n -- '--- SKIP' "$RUNNER_TEMP/pyintegration.log"; then
            echo "::error::a Python-backed Go integration test reported SKIP, so it proved nothing"
            exit 1
          fi

  go-python-integration-basket-replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: scheduler/go.sum

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Python-backed Go integration tests
        run: |
          set -o pipefail
          go -C scheduler test -v -timeout 30m -tags pyintegration -run '^TestBasketReplay[A-Za-z]*$' -skip '^TestBasketReplay(MomentumStudy|ReversalStudy)[A-Za-z]*$' ./... 2>&1 | tee "$RUNNER_TEMP/pyintegration.log"
          if grep -n -- '--- SKIP' "$RUNNER_TEMP/pyintegration.log"; then
            echo "::error::a Python-backed Go integration test reported SKIP, so it proved nothing"
            exit 1
          fi

  shell-suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: scheduler/go.sum

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: |
          uv sync
          sudo apt-get update
          sudo apt-get install -y strace nftables iproute2
          sudo install -d -o "$(id -u)" -g "$(id -g)" -m 0755 /opt/egress
          UV_PYTHON_INSTALL_DIR=/opt/egress/python UV_PROJECT_ENVIRONMENT=/opt/egress/venv uv sync --no-dev --compile-bytecode
          chmod -R a+rX /opt/egress

      - name: Build
        run: |
          go -C scheduler build -o "$RUNNER_TEMP/go-trader" .
          go -C scheduler build -o "$RUNNER_TEMP/go-trader-egress-controller" ./cmd/egress-controller
          go -C scheduler build -o "$RUNNER_TEMP/egress-fixture" ./cmd/egress-fixture

      - name: Observation replay suite
        run: |
          bash scripts/run_ci_shell_suite.sh \
            --marker 'PASS: observation replay harness (sealed payload decisions match recording replay; tampered and truncated recordings refused)' \
            -- bash scripts/test_observation_replay.sh

      - name: Trade-flow replay suite
        run: |
          bash scripts/run_ci_shell_suite.sh \
            --marker 'PASS: trade-flow replay harness (sealed trade-flow payloads and decisions match the independent recording replay; tampered, truncated and contradicted recordings refused)' \
            -- bash scripts/test_trade_flow_replay.sh

      - name: Macro-event replay suite
        run: |
          bash scripts/run_ci_shell_suite.sh \
            --marker 'PASS: macro-event replay harness (Python-imported artifacts sealed by the Go owner give equal websocket, shared and offline decisions; altered artifact bytes refused)' \
            -- bash scripts/test_macro_event_replay.sh

      - name: Volume-profile replay suite
        run: |
          bash scripts/run_ci_shell_suite.sh \
            --marker 'PASS: volume-profile replay harness (sealed profile sessions, hand-calculated value areas and decisions match the independent recording replay; tampered, truncated, contradicted and unclosed recordings refused)' \
            -- bash scripts/test_volume_profile_replay.sh

      - name: Order-book replay suite
        run: |
          bash scripts/run_ci_shell_suite.sh \
            --marker 'PASS: l2_book replay harness (sealed book payloads match the independent recording replay; mixed v3 runs keep every importer; tampered, truncated, unclosed, dropped, mislabeled and contradicted recordings refused)' \
            -- bash scripts/test_book_replay.sh

      - name: Premium replay suite
        run: |
          bash scripts/run_ci_shell_suite.sh \
            --marker 'PASS: premium replay harness (sealed quote/oracle payloads and decisions match the independent recording replay; premium-only, book-only and mixed v3 runs import by their typed contracts and kind/contract mismatches are refused; tampered, truncated and contradicted recordings refused)' \
            -- bash scripts/test_premium_replay.sh

      - name: Allow unprivileged user namespaces for the ledger capture worker
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Ledger capture and export suite
        run: |
          bash scripts/run_ci_shell_suite.sh \
            --marker 'PASS: ledger capture and export (active-WAL capture without source effects, version 2 export contract, every refusal leaves inputs unchanged)' \
            --forbid 'NOTE: strace is not installed; the syscall audit of capture is skipped' \
            --forbid 'NOTE: unshare --user is unavailable here; the shared-mount-namespace worker refusal in a new user namespace is not checked' \
            --forbid 'NOTE: running as root; the permission-denied refusal is not exercised' \
            -- env GO_TRADER_BIN="$RUNNER_TEMP/go-trader" LEDGER_EXPORT_REQUIRE_CAPTURE=1 LEDGER_EXPORT_REQUIRE_STRACE=1 bash scripts/test_ledger_export.sh

      - name: Restore the user namespace restriction
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=1

      - name: Paper merge service fixture (root, systemd)
        run: |
          bash scripts/run_ci_shell_suite.sh \
            --marker 'OK: merge-paper service fixture passed (exit 79 for the second start)' \
            -- sudo env GO_TRADER_BIN="$RUNNER_TEMP/go-trader" MERGE_PAPER_SERVICE_FIXTURE_REQUIRE_RUN=1 bash scripts/test_merge_paper_service_fixture.sh

      - name: Robinhood session service fixture (root, systemd)
        run: |
          bash scripts/run_ci_shell_suite.sh \
            --marker 'OK: robinhood session service fixture passed (state-directory session, owner-only modes, no home writes, reuse on second start)' \
            -- sudo env GO_TRADER_BIN="$RUNNER_TEMP/go-trader" FIXTURE_UV="$(command -v uv)" ROBINHOOD_SESSION_SERVICE_FIXTURE_REQUIRE_RUN=1 bash scripts/test_robinhood_session_service_fixture.sh

      - name: Egress enforcement suite (root, systemd)
        run: |
          bash scripts/run_ci_shell_suite.sh \
            --marker 'PASS: egress enforcement (namespace rules, attestation, relay-only egress, controller loss, address refresh, refusal paths)' \
            --forbid 'NOTE: systemd is not running; the unit sandbox and the launcher are not checked' \
            -- sudo env GO_TRADER_BIN="$RUNNER_TEMP/go-trader" EGRESS_CONTROLLER_BIN="$RUNNER_TEMP/go-trader-egress-controller" EGRESS_FIXTURE_BIN="$RUNNER_TEMP/egress-fixture" EGRESS_VENV_PYTHON=/opt/egress/venv/bin/python3 EGRESS_FIXTURE_REQUIRE_RUN=1 EGRESS_REQUIRE_SYSTEMD=1 bash scripts/test_egress_enforcement.sh

      - name: Build the image for the egress docker suite
        run: docker build -t ghcr.io/richkuo/go-trader:egress-ci .

      - name: Egress docker suite (root, rootful Docker)
        run: |
          bash scripts/run_ci_shell_suite.sh \
            --marker 'PASS: egress docker deployment (anchor enforcement, application attestation, relay-only egress, status relay, one-shot commands, anchor restart)' \
            -- sudo env EGRESS_CONTROLLER_BIN="$RUNNER_TEMP/go-trader-egress-controller" EGRESS_FIXTURE_BIN="$RUNNER_TEMP/egress-fixture" EGRESS_TEST_IMAGE=ghcr.io/richkuo/go-trader:egress-ci EGRESS_DOCKER_FIXTURE_REQUIRE_RUN=1 bash scripts/test_egress_docker.sh

  shell-suites-migrate-1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: scheduler/go.sum

      - name: Build
        run: go -C scheduler build -o "$RUNNER_TEMP/go-trader" .

      - name: Service layout migration fixture (root, systemd)
        run: |
          bash scripts/run_ci_shell_suite.sh \
            --marker 'OK: migrate-service-layout fixture passed (update)' \
            --forbid 'note: this host has a system uv; the root-private uv refusals are skipped' \
            -- sudo env GO_TRADER_BIN="$RUNNER_TEMP/go-trader" FIXTURE_GO="$(command -v go)" FIXTURE_SCENARIOS='update' MIGRATE_SERVICE_LAYOUT_FIXTURE_REQUIRE_RUN=1 bash scripts/test_migrate_service_layout_fixture.sh

  shell-suites-migrate-2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: scheduler/go.sum

      - name: Build
        run: go -C scheduler build -o "$RUNNER_TEMP/go-trader" .

      - name: Service layout migration fixture (root, systemd)
        run: |
          bash scripts/run_ci_shell_suite.sh \
            --marker 'OK: migrate-service-layout fixture passed (stages kill)' \
            --forbid 'note: this host has a system uv; the root-private uv refusals are skipped' \
            -- sudo env GO_TRADER_BIN="$RUNNER_TEMP/go-trader" FIXTURE_GO="$(command -v go)" FIXTURE_SCENARIOS='stages kill' MIGRATE_SERVICE_LAYOUT_FIXTURE_REQUIRE_RUN=1 bash scripts/test_migrate_service_layout_fixture.sh

  shell-suites-migrate-3:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: scheduler/go.sum

      - name: Build
        run: go -C scheduler build -o "$RUNNER_TEMP/go-trader" .

      - name: Service layout migration fixture (root, systemd)
        run: |
          bash scripts/run_ci_shell_suite.sh \
            --marker 'OK: migrate-service-layout fixture passed (refuse plan confirm apply latch conflict resume signal fold newtarget)' \
            --forbid 'note: this host has a system uv; the root-private uv refusals are skipped' \
            -- sudo env GO_TRADER_BIN="$RUNNER_TEMP/go-trader" FIXTURE_GO="$(command -v go)" FIXTURE_SCENARIOS='refuse plan confirm apply latch conflict resume signal fold newtarget' MIGRATE_SERVICE_LAYOUT_FIXTURE_REQUIRE_RUN=1 bash scripts/test_migrate_service_layout_fixture.sh

  python-collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Syntax check
        run: |
          find shared_scripts/ platforms/ shared_strategies/ shared_tools/ \
            -name '*.py' -print0 \
            | xargs -0 uv run python3 -m py_compile

      - name: Test budget
        run: uv run python3 scripts/check_test_budget.py

      - name: Collect every Python test
        run: |
          uv run python3 scripts/check_pytest_shards.py collect default --out "$RUNNER_TEMP/pytest-collect/default.json"
          uv run python3 scripts/check_pytest_shards.py collect shared_scripts --out "$RUNNER_TEMP/pytest-collect/shared_scripts.json" -- shared_scripts/

      - uses: actions/upload-artifact@v4
        with:
          name: pytest-collect
          path: ${{ runner.temp }}/pytest-collect/
          if-no-files-found: error
          retention-days: 7

  python-shard:
    name: python-shard (${{ matrix.suite }} ${{ matrix.group }}/${{ matrix.splits }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {suite: default, group: 1, splits: 3, paths: ''}
          - {suite: default, group: 2, splits: 3, paths: ''}
          - {suite: default, group: 3, splits: 3, paths: ''}
          - {suite: shared_scripts, group: 1, splits: 1, paths: shared_scripts/}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        env:
          SUITE: ${{ matrix.suite }}
          GROUP: ${{ matrix.group }}
          SPLITS: ${{ matrix.splits }}
          PATHS: ${{ matrix.paths }}
        run: |
          uv run pytest ${PATHS:+"$PATHS"} -n auto --durations=25 \
            --splits="$SPLITS" --group="$GROUP" --splitting-algorithm=least_duration \
            --durations-path="scripts/pytest_durations/$SUITE.json" \
            --report-log="$RUNNER_TEMP/pytest-shards/$SUITE-$GROUP-of-$SPLITS.jsonl"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: pytest-shard-${{ matrix.suite }}-${{ matrix.group }}-of-${{ matrix.splits }}
          path: ${{ runner.temp }}/pytest-shards/
          if-no-files-found: error
          retention-days: 7

  python:
    needs: [python-collect, python-shard]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - uses: actions/download-artifact@v4
        with:
          name: pytest-collect
          path: ${{ runner.temp }}/pytest-collect

      - uses: actions/download-artifact@v4
        with:
          pattern: pytest-shard-*
          path: ${{ runner.temp }}/pytest-shards
          merge-multiple: true

      - name: Every default test ran exactly once and passed
        if: ${{ !cancelled() }}
        run: |
          uv run --no-project python3 scripts/check_pytest_shards.py verify default \
            --collected "$RUNNER_TEMP/pytest-collect/default.json" --logs "$RUNNER_TEMP/pytest-shards" \
            --durations scripts/pytest_durations/default.json --durations-out "$RUNNER_TEMP/pytest-durations/default.json"

      - name: Every shared_scripts test ran exactly once and passed
        if: ${{ !cancelled() }}
        run: |
          uv run --no-project python3 scripts/check_pytest_shards.py verify shared_scripts \
            --collected "$RUNNER_TEMP/pytest-collect/shared_scripts.json" --logs "$RUNNER_TEMP/pytest-shards" \
            --durations scripts/pytest_durations/shared_scripts.json --durations-out "$RUNNER_TEMP/pytest-durations/shared_scripts.json"

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: pytest-durations
          path: ${{ runner.temp }}/pytest-durations/
          if-no-files-found: warn
          retention-days: 90

      - name: Every Python job passed
        if: ${{ !cancelled() }}
        env:
          COLLECT: ${{ needs.python-collect.result }}
          SHARDS: ${{ needs.python-shard.result }}
        run: |
          echo "python-collect: $COLLECT, python-shard: $SHARDS"
          if [ "$COLLECT" != success ] || [ "$SHARDS" != success ]; then
            echo "::error::a Python CI job did not succeed"
            exit 1
          fi
